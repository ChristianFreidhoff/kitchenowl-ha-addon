
name: Check Upstream Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/meijer3/kitchenowl-ha-addon.git
          git fetch upstream main

      - name: Check for upstream changes
        run: |
          COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits not yet in fork: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::Upstream has $COUNT new commit(s). Review upstream changes."
            git log --oneline HEAD..upstream/main
          else
            echo "Fork is up to date with upstream."
          fi
