
name: Bump KitchenOwl Add-on Version

on:
  push:
    branches:
      - main
    paths:
      - 'kitchenowl/Dockerfile'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump patch version
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("kitchenowl/config.yaml")
          content = path.read_text()

          pattern = r'^(version:\s*["\']?)(\d+)\.(\d+)\.(\d+)(["\']?)$'

          def bump(match):
              prefix, major, minor, patch, suffix = match.groups()
              return f"{prefix}{major}.{minor}.{int(patch) + 1}{suffix}"

          updated, count = re.subn(
              pattern,
              bump,
              content,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit("Version not found")

          path.write_text(updated)
          PY

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kitchenowl/config.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Bump KitchenOwl add-on version"
            git push
          fi
